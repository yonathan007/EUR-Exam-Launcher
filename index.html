<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#002328"><title>EUR Exam Launcher</title><link rel="stylesheet" href="style.css"><script src="config.js" defer></script><script src="app.js" defer></script></head>
<body><main class="shell"><header><div><strong>EXAM LAUNCHER</strong><small id="step-label">Stap 1 van 3</small></div><div class="header-actions"><div class="language-switch" role="group" aria-label="Language / Taal"><button type="button" id="lang-nl" class="lang-btn" aria-label="Nederlands" aria-pressed="true">🇳🇱 NL</button><button type="button" id="lang-en" class="lang-btn" aria-label="English" aria-pressed="false">🇬🇧 EN</button></div></div></header><div class="progress"><span id="progress"></span></div><section id="content" aria-live="polite"></section><div id="idle-warning" class="idle-warning" hidden role="status"></div><footer><span>MDT-DWO · Yonathan Gelaw</span><span class="footer-right"><span id="clock"></span><span class="app-version" aria-label="Versie">v0.2.19</span></span></footer></main>
<section id="full-rules-view" class="full-rules-view" hidden aria-label="Volledige tentamenregels"><div class="full-rules-header"><h2 id="full-rules-title">Tentamenregels EUR 2026–2027</h2><button type="button" class="btn secondary" id="close-full-rules">← Terug naar examenregels</button></div><iframe class="full-rules-pdf" title="Tentamenregels EUR 2026–2027" src="assets/de_tentamenregels-eur-2026-2027.pdf"></iframe><a id="pdf-direct-link" href="assets/de_tentamenregels-eur-2026-2027.pdf" target="_blank" rel="noopener">PDF niet zichtbaar? Open het document rechtstreeks.</a></section>
<dialog id="confirm-dialog" aria-labelledby="dialog-title"><div class="dialog-body"><h2 id="dialog-title">Examenomgeving starten?</h2><p id="dialog-message"></p><div class="actions"><button type="button" id="cancel-exam" class="btn secondary">Annuleren</button><button type="button" id="start-exam" class="btn">Examen openen</button></div></div></dialog>
</body></html>
