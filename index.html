<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#002328"><title>EUR Exam Launcher</title><link rel="stylesheet" href="style.css"><script src="config.js" defer></script><script src="app.js" defer></script></head>
<body><main class="shell"><header><div><strong>EXAM LAUNCHER</strong><small id="step-label">Stap 1 van 3</small></div><button type="button" id="home" class="btn secondary small" hidden>⌂ Startscherm</button></header><div class="progress"><span id="progress"></span></div><section id="content" aria-live="polite"></section><div id="idle-warning" class="idle-warning" hidden role="status"></div><footer><span>MDT-DWO · Yonathan Gelaw</span><span id="clock"></span></footer></main>
<dialog id="confirm-dialog" aria-labelledby="dialog-title"><div class="dialog-body"><h2 id="dialog-title">Examen starten?</h2><p id="dialog-message"></p><p class="dialog-note">Na het openen verlaat je de launcher. Terugkeer is afhankelijk van ChromeOS-kioskbeleid en de examenomgeving. De launcher kan een actief examen niet beëindigen.</p><div class="actions"><button type="button" id="cancel-exam" class="btn secondary">Annuleren</button><button type="button" id="start-exam" class="btn">Examen openen</button></div></div></dialog>
</body></html>
